name: Update release data

# Rebuilds models.json from the open source models.dev repository (MIT).

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get the open source catalog
        run: git clone --depth 1 https://github.com/anomalyco/models.dev /tmp/models-dev
      - name: Build models.json
        run: python3 tools/build_data.py /tmp/models-dev .
      - name: Commit when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models.json
          git diff --cached --quiet || (git commit -m "Update release data" && git push)
